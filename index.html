<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e14">
  <title>生命棋局 · 红蓝对决</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 顶部 HUD -->
  <div id="hud">
    <div class="chip">
      <div class="row"><span class="dot red"></span><b id="score-red">0</b></div>
      <div class="cd"><i id="cd-red"></i></div>
    </div>
    <div id="turn-info">—</div>
    <button id="btn-restart" title="重新开始本局">↻</button>
    <div class="chip">
      <div class="row"><span class="dot blue"></span><b id="score-blue">0</b></div>
      <div class="cd"><i id="cd-blue"></i></div>
    </div>
  </div>

  <!-- 底部提示 / 热座按钮 -->
  <div id="hint-bar"><span id="hint-text">点击空白格部署 · 滑动移动角色</span></div>
  <div id="pvp-bar" hidden>
    <button id="btn-red" class="pvp-btn red">🔴 红方行动</button>
    <button id="btn-blue" class="pvp-btn blue">🔵 蓝方行动</button>
  </div>

  <!-- 开始界面 -->
  <div id="start-screen" class="overlay">
    <div class="title">生命棋局</div>
    <div class="subtitle">红蓝对决 · 康威生命游戏</div>
    <button class="mode-btn" onclick="startGame('pvp')">⚔️ 双人对战（同屏热座）</button>
    <button class="mode-btn" onclick="startGame('pve')">🤖 人机对战（你是红方）</button>
    <button class="mode-btn" onclick="startGame('watch')">👀 观战模式（AI 互斗）</button>
    <div class="rules">
      <b>规则</b><br>
      · 红蓝各有一个带<b>白色光环</b>的角色，对角开局<br>
      · 角色每秒可行动 1 次：<b>点击</b>半径 2 内的空格部署己方细胞；<b>滑动</b>可移动一格<br>
      · 己方细胞遵循康威规则（B3/S23）；刚部署的细胞有 2 秒保护期<br>
      · 敌方细胞一旦贴到角色，角色<b>瞬间被消灭</b>；角色相撞则同归于尽<br>
      · 角色免疫康威规则，不会自然死亡
    </div>
    <div class="footer">代码托管于 GitHub · 本地部署运行</div>
  </div>

  <!-- 结算界面 -->
  <div id="over-screen" class="overlay" hidden>
    <h2 id="winner-text"></h2>
    <button class="mode-btn" onclick="restart()">🔄 再来一局</button>
    <button class="mode-btn ghost" onclick="goHome()">🏠 返回主菜单</button>
  </div>

  <script src="js/lib/p5.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/player.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
